[workspace]
authors = [
  "Liza Wood <belwood@ucdavis.edu>"
]
name = "workshop_network_viz"
description = "Reader for the Network Visualization workshop."
version = "2026.fall.0"  # <year>.<quarter>.<revision #>

channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]


[tasks]
build = { cmd = "quarto render", description = "Build the reader." }
publish = { cmd = "ghp-import --no-jekyll --no-history --push _build", description = "Publish the reader to the `gh-pages` branch on GitHub." }
clean = { cmd = "rm -rf _build/", description = "Remove the build directory." }
rebuild = { depends-on = ["clean", "build"], description = "Remove the build directory and build the reader." }


[dependencies]
quarto = ">=1.11.9,<2"
ghp-import = ">=2.1.0,<3"
r = ">=4.5,<4.6"
r-knitr = ">=1.52,<2"
r-rmarkdown = ">=2.32,<3"
r-network = ">=1.20.0,<2"
r-sna = ">=2.8,<3"
r-igraph = ">=2.3.4,<3"
r-intergraph = ">=2.0_4,<3"
r-ggraph = ">=2.2.2,<3"
r-tidygraph = ">=1.3.0,<2"
r-ggplot2 = ">=4.0.3,<5"
r-viridis = ">=0.6.5,<0.7"
r-dplyr = ">=1.2.1,<2"
r-tidyr = ">=1.3.2,<2"
r-magrittr = ">=2.0.5,<3"
r-kableextra = ">=1.4.1,<2"
r-magick = ">=2.9.1,<3"
r-here = ">=1.0.2,<2"
r-ggally = ">=2.4.0,<3"
r-ggnetwork = ">=0.5.14,<0.6"
r-visnetwork = ">=2.1.4,<3"
r-networkd3 = ">=0.4.1,<0.5"
r-bipartite = ">=2.24,<3"


[activation.env]
# Make sure R only searches for packages within the Pixi environment.
PIXI_R_LIBS = "$CONDA_PREFIX/lib/R/library"
R_LIBS = "$PIXI_R_LIBS"
R_LIBS_USER = "$PIXI_R_LIBS"
QUARTO_R = "$CONDA_PREFIX/bin/R"
